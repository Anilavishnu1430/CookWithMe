@if(isLoggedIn){
    <app-header></app-header>
    <div class="m-5">
        <div class="mb-3">
            <h6 class="text-muted">{{today | date:'short'}}</h6>
        </div>
        <div class="mb-4 d-flex justify-content-center">
            <div class="w-50">
                <input type="text" class="form-control" [(ngModel)]="searchKey" name="searchKey"
                    placeholder="Search Recipe">
            </div>
        </div>

        <div class="d-flex gap-4">
            <div class="w-25">
                <h5>Filter</h5>
                <div class="ms-2">
                    <button class="btn p-0" (click)="handleFilter('All')">All</button>
                </div>
                <div>
                    <select class="form-select filter-select" [(ngModel)]="selectedCuisine" (change)="handleFilter(selectedCuisine)">
                        <option value="All">Cuisine Type</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Brazilian">Brazilian</option>
                        <option value="Italian">Italian</option>
                        <option value="Indian">Indian</option>
                    </select>
                </div>
                <div>
                    <select class="form-select filter-select" [(ngModel)]="selectedMeal" (change)="handleFilter(selectedMeal)">
                        <option value="All">Meal Type</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>
            </div>

            <div class="w-75">
                <h3 class="mb-3 text-warning">All Recipes</h3>
                <div class="row g-4">
                    @for (item of filteredRecipes | paginate: { itemsPerPage: 8, currentPage: p } | search : searchKey; track
                    $index) {
                    <div class="col-md-3">
                        <div (click)="viewRecipe(item._id)" class="card h-100">
                            <img [src]="item.image" class="card-img-top recipe-img" alt="recipe image">
                            <div class="card-body">
                                <h6 class="card-title text-center">{{item.name}}</h6>
                            </div>
                        </div>
                    </div>
                    }
                    <pagination-controls (pageChange)="p = $event"></pagination-controls>
                </div>
            </div>
        </div>
    </div>
    <app-footer></app-footer>
}
@else{
    <div class="text-center mt-5">
        <img src="chefimg.png" alt="chef" class="img-fluid" width="350">
        <h4 class="text-warning">Cook With Me</h4>
        <h1 class="text-warning">Please Login</h1>
        <p class="text-warning">You need to login to view recipes</p>
        <button routerLink="/login" class="btn btn-warning">Login</button>
    </div>
}
