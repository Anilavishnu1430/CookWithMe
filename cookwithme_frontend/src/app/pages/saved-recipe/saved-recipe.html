<app-header></app-header>

<div class="m-5">
      <div class="bg-white p-4 rounded shadow">

        <div class="d-flex justify-content-between mb-3">
          <h4>Saved Recipes 🍽</h4>
          <span class="bg-warning text-black p-2 fw-semibold rounded">
            {{savedList.length}} Recipes
          </span>
        </div>

        <div class="row">
          @for (item of savedList; track $index) {
            <div class="col-md-4 mb-3">
            <div class="card h-100">
              <img [src]="item.image" alt="Recipe image"
                   class="card-img-top recipe-img">
              <div class="card-body">
                <h6 class="text-center">{{item.name}}</h6>
              </div>
              <div class="ps-4 pb-2">
                <i class="fa-solid fa-trash" (click)="deleteRecipe(item._id)"></i>
              </div>
            </div>
          </div>
          }

          

        </div>

      </div>
    </div>

<app-footer></app-footer>
