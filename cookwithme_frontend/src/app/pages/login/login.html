<div class="container-fluid vh-100">
  <div class="row h-100">
    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-warning">
      <h1 class="text-white fw-bold">CookWithMe</h1>
      <p class="text-muted fs-5">
        Discover, save, and share your favorite recipes 🍽️
      </p>
      <img src="chefimg.png"
           width="250"
           alt="Recipe">
    </div>
    <div class="col-md-6 d-flex justify-content-center align-items-center">
      
      <div class="login-card p-5 rounded">

        <h2 class="text-center text-warning mb-4">
          Welcome Back
        </h2>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="mb-3">
            <label>Email Address</label>
            <input formControlName="email" type="email" class="form-control" placeholder="Enter your email"></div>

          <div class="mb-3">
            <label>Password</label>
            <input formControlName="password" type="password" class="form-control" placeholder="Enter your password">
          </div>

          <button type="submit" class="btn btn-warning w-100 mb-3">
            Login
          </button>

          <p class="text-center">
            Don't have an account?
            <a href="register">Register</a>
          </p>
        </form>

      </div>

    </div>
  </div>
</div>
