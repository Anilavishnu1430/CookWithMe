<div class="container-fluid vh-100">
  <div class="row h-100">

    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-warning">
      <h1 class="text-white fw-bold">CookWithMe</h1>
      <p class="text-muted fs-5">
        Join us and start saving your favorite recipes 🍽️
      </p>

      <img src="chefimg.png"
           width="250"
           alt="Recipe">
    </div>

    <div class="col-md-6 d-flex justify-content-center align-items-center">

      <div class="register-card p-5 rounded">

        <h2 class="text-center text-warning mb-4">
          Create Account
        </h2>

        <form>

          <div class="mb-3">
            <label>Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label>Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="Enter your password">
          </div>


          <button type="button" class="btn btn-warning w-100 mb-3">
            Register
          </button>

          <p class="text-center">
            Already have an account?
            <a href="login">Login</a>
          </p>

        </form>

      </div>

    </div>
  </div>
</div>
