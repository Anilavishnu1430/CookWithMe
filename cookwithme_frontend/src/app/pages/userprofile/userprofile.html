<div class="container mt-5">
  <div class="row g-4">

    <!-- Left Profile -->
    <div class="col-md-4">
      <div class="bg-white p-4 rounded shadow text-center">
        
        <img src="https://freesvg.org/img/abstract-user-flat-3.png"
             class="rounded-circle mb-3 profile-img"
             alt="Profile">
        <h2><strong>Welcome Back</strong> 👋</h2>
        <p class="text-muted">
          Update your profile picture and manage your account.
        </p>

        <button class="btn btn-warning text-white">
          Update Profile
        </button>

      </div>
    </div>


    <!-- Right Recipe Cards -->
    <div class="col-md-8">
      <div class="bg-white p-4 rounded shadow">

        <div class="d-flex justify-content-between mb-3">
          <h4>Downloaded Recipes 🍽</h4>
          <span class="bg-warning text-black p-2 fw-semibold rounded">
            {{downloadList.length}} Recipes
          </span>
        </div>

        <div class="row">
          @for (item of downloadList; track $index) {
            <div class="col-md-4 mb-3">
            <div class="card h-100">
              <img [src]="item.image" alt=""
                   class="card-img-top recipe-img">
              <div class="card-body">
                <h6>{{item.name}}</h6>
                <h6><i class="fa-solid fa-trash" (click)="deleteRecipe(item._id)"></i></h6>
              </div>
            </div>
          </div>
          }

          

        </div>

      </div>
    </div>

  </div>
</div>
