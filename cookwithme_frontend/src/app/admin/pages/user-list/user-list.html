<app-admin-header></app-admin-header>
<div class="row">
  <div class="col-2">
    <app-sidebar></app-sidebar>
  </div>
  <div class="col-10">
    <div class="container-fluid p-4 vh-100">
    <h1 class="text-center text-warning mb-5">All Users List</h1>
    <table class="table border align-middle text-center">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
        </tr>
      </thead>

      <tbody>
        @for (item of allUsers | paginate: { itemsPerPage: 4, currentPage: p }; track $index; let i=$index) {
          <tr>
          <td>{{i+1}}</td>
          <td>{{item.username}}</td>
          <td>{{item.email}}</td>
        </tr>
        }
      </tbody>
    </table>
    <pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>



  </div>
</div>
