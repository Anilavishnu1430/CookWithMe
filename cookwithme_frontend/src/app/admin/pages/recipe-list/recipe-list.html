<app-admin-header></app-admin-header>
<div class="row">
    <div class="col-2">
        <app-sidebar></app-sidebar>
    </div>
    <div class="col-10">
        <div class="container-fluid p-4 vh-100">
    <h1 class="text-center text-warning mb-5">All Recipe List</h1>

    <div class="d-flex justify-content-between mb-4">
        <button class="btn btn-success" routerLink="/admin/recipe/add"> Add Recipe </button>
        <input type="text" class="form-control w-25" placeholder="Search Recipe">
    </div>

    <table class="table border align-middle text-center">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Image</th>
                <th>Cuisine</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            @for (item of recipes | paginate: { itemsPerPage: 4, currentPage: p }; track $index) {
                <tr>
                    <td>{{item.id}}</td>
                    <td>{{item.name}}</td>
                    <td><img [src]="item.image" alt="" height="50px" width="50px"/></td>
                    <td>{{item.cuisine}}</td>
                    <td>
                    <i class="fa-solid fa-pen me-3" routerLink="/admin/recipe/edit/1"></i>
                    <i class="fa-solid fa-trash" (click)="deleteRecipe(item._id)"></i>
                </td>
                </tr>
            }
        </tbody>
    </table>
    <pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>
    </div>
</div>
