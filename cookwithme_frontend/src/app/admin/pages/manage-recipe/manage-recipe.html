<app-admin-header></app-admin-header>

<div class="row">
  <div class="col-2">
    <app-sidebar></app-sidebar>
  </div>

  <div class="col-10">
    <div class="container-fluid min-vh-100 p-4">

      <h1 class="text-center mb-4">
        {{ recipeId ? 'Edit Recipe Details' : 'Add Recipe Details' }}
      </h1>

      <form>
        <div class="bg-white shadow p-4 rounded">

          <div class="row">

            <!-- LEFT SIDE -->
            <div class="col">

              <!-- Recipe Name -->
              <div class="mb-3">
                <label class="mb-1">Recipe Name</label>

                <input
                  [(ngModel)]="recipeDetails.name"
                  type="text"
                  name="name" value="recipeDetails.name"
                  class="form-control">
              </div>

              <!-- Preparation Time -->
              <div class="mb-3">
                <label class="mb-1">Preparation Time</label>

                <input
                  [(ngModel)]="recipeDetails.prepTimeMinutes"
                  name="prepTimeMinutes"
                  type="text"
                  class="form-control">
              </div>

              <!-- Cuisine -->
              <div class="mb-3">
                <label class="mb-1">Choose Cuisine Type</label>

                <select [(ngModel)]="recipeDetails.cuisine"  name="cuisine" id="cuisine" class="form-control mb-3">
     <option value="" hidden selected>Choose</option>
               @for (item of cuisineArray; track $index) {
 <option [value]="item">{{item}}</option>
               }
                
            

            </select>
              </div>

              <!-- Image -->
              <div class="mb-3">
                <label class="mb-1">Recipe Image URL</label>

                <input
                  [(ngModel)]="recipeDetails.image"
                  type="text"
                  name="image"
                  class="form-control">
              </div>

              <!-- Ingredients -->
              <div class="mb-3">

                <label class="mb-1">Ingredients</label>

                <div class="d-flex">

                  <textarea
                    class="form-control"
                    rows="2"
                    #ingredients
                    name="ingredientsText">
                  </textarea>

                  <button
                    type="button"
                    class="btn btn-success ms-2"
                    (click)="addIngridients(ingredients)">

                    +
                  </button>

                </div>

                <div class="d-flex flex-column justify-content-between mt-3">

                  @for (item of ingridientsArray; track $index) {

                    <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">

                      <h6 class="mb-0">{{ item }}</h6>

                      <i
                        class="fa-solid fa-trash text-danger"
                        role="button"
                        (click)="deleteIngridients(item)">
                      </i>

                    </div>

                  }

                </div>

              </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col">

              <!-- Cooking Time -->
              <div class="mb-3">

                <label class="mb-1">Cooking Time</label>

                <input
                  [(ngModel)]="recipeDetails.cookTimeMinutes"
                  name="cookTimeMinutes"
                  type="text"
                  class="form-control">

              </div>

              <!-- Servings -->
              <div class="mb-3">

                <label class="mb-1">Recipe Servings</label>

                <input
                  [(ngModel)]="recipeDetails.servings"
                  type="text"
                  name="servings"
                  class="form-control">

              </div>

              <!-- Difficulty -->
              <div class="mb-3">

                <label class="mb-1">Mode of Cooking</label>

                <select
                  [(ngModel)]="recipeDetails.difficulty"
                  name="difficulty"
                  class="form-select">

                  <option value="">Select Difficulty</option>
                  <option>Easy</option>
                  <option>Medium</option>
                  <option>Hard</option>

                </select>

              </div>

              <!-- Calories -->
              <div class="mb-3">

                <label class="mb-1">Calories</label>

                <input
                  [(ngModel)]="recipeDetails.caloriesPerServing"
                  name="caloriesPerServing"
                  type="text"
                  class="form-control">

              </div>

              <!-- Instructions -->
              <div class="mb-3">

                <label class="mb-1">Instructions</label>

                <div class="d-flex">

                  <textarea
                    class="form-control"
                    rows="2"
                    #instructions
                    name="instructionsText">
                  </textarea>

                  <button
                    type="button"
                    class="btn btn-success ms-2"
                    (click)="addInstruction(instructions)">

                    +
                  </button>

                </div>

                <div class="d-flex flex-column justify-content-between mt-3">

                  @for (item of instructionsArray; track $index) {

                    <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2">

                      <h6 class="mb-0">{{ item }}</h6>

                      <i
                        class="fa-solid fa-trash text-danger"
                        role="button"
                        (click)="deleteInstructions(item)">
                      </i>

                    </div>

                  }

                </div>

              </div>

            </div>

          </div>

          <!-- Meal Type -->
          <div class="col-12 border rounded p-3 mt-2">

            <label class="mb-3">Choose Meal Type :</label>

            <div class="d-flex flex-wrap gap-3">

              @for (item of mealTypeArray; track $index) {

                <div>

                  <input
                    type="checkbox"
                    [value]="item"
                    (change)="getMealType($event)">

                  {{ item }}

                </div>

              }

            </div>

          </div>

          <!-- Buttons -->
          <div class="text-center mt-4">

            @if(recipeId){

              <button
                type="button"
                class="btn btn-primary px-4"
                (click)="editRecipe()">

                Edit Recipe

              </button>

            }

            @else {

              <button
                type="button"
                class="btn btn-success px-4"
                (click)="addRecipe()">

                Add Recipe

              </button>

            }

          </div>

        </div>
      </form>

    </div>
  </div>
</div>
